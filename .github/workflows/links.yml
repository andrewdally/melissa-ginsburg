# Builds the site and checks every link on it, so dead links get noticed.
# Separate from publishing: a broken outside link never blocks an update.
name: Check links

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, since outside sites move and disappear on their own.
  schedule:
    - cron: '41 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          # Outside links on the built pages. Internal links are made by the build.
          # Some big sites (Amazon, Instagram) refuse robots with 403 or 429.
          args: >-
            --scheme https
            --scheme http
            --max-retries 3
            --retry-wait-time 5
            --accept 200..=299,403,429
            --exclude-path dist/_astro
            'dist/**/*.html'
          fail: true
